[project]
name = "git-remote-gdrive"
version = "0.1.0"
description = "A git remote's helper for google drive"
authors = [{name = "Marcelo Vilela", email = "marcelo.filho.cps@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"


dependencies = [
    "google-api-python-client>=2.169.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "GitPython>=3.1.43",
]

[project.scripts]
git-remote-gdrive = "src.app:main"
git-remote-gd = "src.app:main"
git-remote-google-drive = "src.app:main"

[tool.setuptools]
packages = ["src"]


